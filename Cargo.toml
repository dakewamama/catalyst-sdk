[package]
name = "catalyst-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
arm = { git = "https://github.com/dakewamama/arm", rev = "5b05e06892dcc6d20d1db7f0324030916b152d6a" }
solana-instruction = "=3.4.0"
